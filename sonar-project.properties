sonar.projectKey=rochdi1_lernportal
sonar.projectName=Lernportal
sonar.projectVersion=1.0

# Sources (Backend + Frontend)
sonar.sources=lernportal-backend/src/main,lernportal-frontend/src
sonar.tests=lernportal-backend/src/test

# Java
sonar.java.binaries=lernportal-backend/build/classes/java/main
sonar.java.source=25

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/.angular/**,**/*.spec.ts

# Coverage (optional – reports generated by test tasks)
sonar.coverage.exclusions=**/*.spec.ts,lernportal-frontend/src/main.ts
name: CD - ArgoCD (GitOps)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev|prod)
        required: true
        default: dev

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lernportal-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lernportal-frontend

jobs:
  backend:
    name: Backend Build & Test
    runs-on: [self-hosted, local]
    defaults:
      run:
        working-directory: lernportal-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run backend tests
        run: ./gradlew test
      - name: Build backend
        run: ./gradlew build -x test

  frontend:
    name: Frontend Build & Test
    runs-on: [self-hosted, local]
    defaults:
      run:
        working-directory: lernportal-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npx ng test --watch=false
      - name: Build frontend
        run: npx ng build --configuration production

  sonarqube:
    name: SonarQube Scan
    runs-on: [self-hosted, local]
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build backend (Gradle)
        working-directory: lernportal-backend
        run: ./gradlew build -x test
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Docker Build & Push
    runs-on: [self-hosted, local]
    needs: sonarqube
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: type=sha,type=raw,value=latest
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./lernportal-backend
          file: ./lernportal-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:cache,mode=max
          build-args: GITHUB_SHA=${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./lernportal-frontend
          file: ./lernportal-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:cache,mode=max
          build-args: GITHUB_SHA=${{ github.sha }}

  update-argocd:
    name: Sync ArgoCD Application
    runs-on: [self-hosted, local]
    needs: docker
    strategy:
      matrix:
        app: [lernportal-dev, lernportal-prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ArgoCD CLI
        run: |
          mkdir -p /home/casa/.local/bin
          curl -sSL -o /home/casa/.local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /home/casa/.local/bin/argocd
          /home/casa/.local/bin/argocd version --client
      - name: Configure kubectl context
        run: |
          mkdir -p /home/casa/.kube
          echo "${{ secrets.KUBECONFIG }}" > /home/casa/.kube/config
          chmod 600 /home/casa/.kube/config
      - name: Port-forward ArgoCD server, login & sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
          APP: ${{ matrix.app }}
        run: |
          # Start persistent port-forward in background (use 8080 to avoid conflict with other ArgoCD components on 8081)
          nohup kubectl port-forward svc/argocd-server -n argocd 8080:80 > /tmp/argocd-pf.log 2>&1 &
          PF_PID=$!
          echo "Port-forward started (PID: $PF_PID) on 127.0.0.1:8080"
          # Wait for port-forward to become ready (max 30s)
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/api/v1/applications 2>/dev/null; then
              echo "ArgoCD API reachable"
              break
            fi
            sleep 1
            if [ $i -eq 30 ]; then
              echo "Timeout: ArgoCD not reachable after 30s"
              cat /tmp/argocd-pf.log
              exit 1
            fi
          done
          # Prepare server address (strip protocol if present)
          SERVER="$ARGOCD_SERVER"
          SERVER="${SERVER#http://}"
          SERVER="${SERVER#https://}"
          echo "Logging in to $SERVER..."
          /home/casa/.local/bin/argocd login "$SERVER" \
            --username "$ARGOCD_USERNAME" \
            --password "$ARGOCD_PASSWORD" \
            --grpc-web --insecure
          echo "Updating app ${APP}..."
          /home/casa/.local/bin/argocd app set "${APP}" \
            --parameter "image.tag=${{ github.sha }}"
          /home/casa/.local/bin/argocd app sync "${APP}" --prune
          /home/casa/.local/bin/argocd app wait "${APP}" --health

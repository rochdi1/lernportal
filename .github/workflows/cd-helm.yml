name: CD - Helm

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lernportal-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lernportal-frontend

jobs:
  backend:
    name: Backend Build & Test
    runs-on: [self-hosted, local]
    defaults:
      run:
        working-directory: lernportal-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run backend tests
        run: ./gradlew test
      - name: Build backend
        run: ./gradlew build -x test

  frontend:
    name: Frontend Build & Test
    runs-on: [self-hosted, local]
    defaults:
      run:
        working-directory: lernportal-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npx ng test --watch=false
      - name: Build frontend
        run: npx ng build --configuration production

  sonarqube:
    name: SonarQube Scan
    runs-on: [self-hosted, local]
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Docker Build & Push
    runs-on: [self-hosted, local]
    needs: sonarqube
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./lernportal-backend
          file: ./lernportal-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./lernportal-frontend
          file: ./lernportal-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy-dev:
    name: Deploy to Development (helm)
    runs-on: [self-hosted, local]
    needs: docker
    environment:
      name: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'
      - name: Lint backend chart
        run: helm lint ./helm/backend
      - name: Deploy backend
        run: |
          helm upgrade --install lernportal-backend ./helm/backend \
            --values ./helm/backend/values-dev.yaml \
            --namespace lernportal-dev --create-namespace \
            --set image.tag=${{ github.sha }}
      - name: Lint frontend chart
        run: helm lint ./helm/frontend
      - name: Deploy frontend
        run: |
          helm upgrade --install lernportal-frontend ./helm/frontend \
            --values ./helm/frontend/values-dev.yaml \
            --namespace lernportal-dev --create-namespace \
            --set image.tag=${{ github.sha }}

  deploy-prod:
    name: Deploy to Production (helm)
    runs-on: [self-hosted, local]
    needs: deploy-dev
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'
      - name: Deploy backend
        run: |
          helm upgrade --install lernportal-backend ./helm/backend \
            --values ./helm/backend/values-prod.yaml \
            --namespace lernportal-prod --create-namespace \
            --set image.tag=${{ github.sha }}
      - name: Deploy frontend
        run: |
          helm upgrade --install lernportal-frontend ./helm/frontend \
            --values ./helm/frontend/values-prod.yaml \
            --namespace lernportal-prod --create-namespace \
            --set image.tag=${{ github.sha }}
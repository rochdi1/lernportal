services:
  db:
    image: postgres:16-alpine
    container_name: learning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learning_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning_pass}
      POSTGRES_DB: ${POSTGRES_DB:-learning_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - learning-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learning_user} -d ${POSTGRES_DB:-learning_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./lernportal-backend
    container_name: learning-java-core
    #restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-learning_dashboard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-learning_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-learning_pass}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - learning-net
    mem_limit: 768m

  frontend:
    build:
      context: ./lernportal-frontend
    container_name: learning-frontend
    #restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - learning-net
    mem_limit: 256m

volumes:
  db-data:

networks:
  learning-net:
    driver: bridge